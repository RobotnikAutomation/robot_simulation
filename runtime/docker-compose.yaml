name: robotnik_simulation

services:
  robotnik_simulation:
    container_name: robotnik_simulation
    image: robotnik_simulation:jazzy
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY}
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      WORKSPACE_DIR: /opt/robotnik_ws
      RUNTIME_AUTOSTART: ${RUNTIME_AUTOSTART:-true}
      ROBOTNIK_LAUNCH_PACKAGE: ${ROBOTNIK_LAUNCH_PACKAGE:-robotnik_simulation_bringup}
      ROBOTNIK_LAUNCH_FILE: ${ROBOTNIK_LAUNCH_FILE:-bringup_complete.launch.py}
      ROBOTNIK_LAUNCH_ARGS: ${ROBOTNIK_LAUNCH_ARGS:-robot:=rbwatcher robot_model:=rbwatcher use_gui:=true use_rviz:=true}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
