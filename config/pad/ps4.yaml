plugins:
  - Movement
#  - MovementSafe
#  - Elevator
#  - Poi
#  - Ptz
#  - KinovaArm

pad:
  type: ps4
  num_of_buttons: 14
  num_of_axes: 14
  joy_timeout: 5.0

Movement:
  type: robotnik_pad_plugins/Movement
  max_linear_speed: 1.5
  max_angular_speed: 1.5
  cmd_topic_vel: pad_teleop/cmd_vel
  config:
    use_accel_watchdog: true
    watchdog_duration: 0.5
    axis_watchdog: 8
    button_deadman: 5
    axis_linear_x: 1
    axis_linear_y: 0
    axis_angular_z: 2
    button_speed_up: 3
    button_speed_down: 1
    button_kinematic_mode: 7

MovementSafe:
  type: robotnik_pad_plugins/Movement
  max_linear_speed: 1.5
  max_angular_speed: 1.5
  cmd_topic_vel: safety_controller_pad/cmd_vel
  config:
    use_accel_watchdog: true
    watchdog_duration: 0.5
    axis_watchdog: 8
    button_deadman: 4
    axis_linear_x: 1
    axis_linear_y: 0
    axis_angular_z: 2
    button_speed_up: 3
    button_speed_down: 1
    button_kinematic_mode: 7

Elevator:
  type: robotnik_pad_plugins/Elevator
  elevator_service_name: robotnik_base_control/set_elevator
  config:
    deadman: 5
    axis_elevator: 10


Poi:
  type: robotnik_pad_plugins/Poi
  poi_service_name: poi_interactive_marker/save_robot_pose
  config:
    deadman: 5
    save_poi_l3: 10
    save_poi_r3: 11

Ptz:
  type: robotnik_pad_plugins/Ptz
  cmd_topic_ptz: $(arg cmd_ptz_topic)
  
  speed_increment: 0.5
  speed_limit: 3.14

  home_pan_position: 0.0
  home_tilt_position: 0.0
  home_zoom_position: 0.0
  
  position_increment: 0.1
  position_increment_limit: 0.5
  min_pan_position: -3.14
  max_pan_position: 3.14
  min_tilt_position: -1.57
  max_tilt_position: 1.57
  max_zoom_position: 12000

  set_position_mode: false # if false, set speed mode

  config:
    inverted_tilt_ptz: true
    inverted_pan_ptz: false
    button_deadman: 5
    button_home: 12
    button_pan:  10
    button_tilt: 9
    button_zoom_in: 4 
    button_zoom_out: 6
    button_increment_up: 2 
    button_increment_down: 0
    #button_ptz_mode: 8

KinovaArm:
  type: kinova_pad_plugin/KinovaArm
  arm_control_topic_name: /robot/$(arg arm_model)_controller/in/cartesian_velocity_with_fingers
  set_home_service_name: /robot/$(arg arm_model)_controller/in/home_arm
  max_linear_speed: 2.0
  max_angular_speed: 3.0
  config:
    button_deadman: 4
    button_movement_deadman: 5 # this plugin will not work if movement deadman button is pressed
    button_home_arm: 12

    axis_open_gripper: 4
    axis_close_gripper: 3

    axis_linear_x_ee: 1
    axis_linear_y_ee: 0
    axis_linear_z_ee: 10

    axis_angular_x_ee: 5
    axis_angular_y_ee: 2
    axis_angular_z_ee: 9

    button_speed_up: 3
    button_speed_down: 1